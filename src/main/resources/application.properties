spring.application.name=cybershield
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/cybershield_app}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=5
server.error.include-message=never
server.error.include-stacktrace=never
app.jwt-secret=${JWT_SECRET}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
app.admin-name=${ADMIN_NAME:Workspace Admin}
